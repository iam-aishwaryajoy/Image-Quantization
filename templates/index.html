<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Color Quantizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        input[type="file"] {
            padding: 10px;
            border: 2px dashed #aaa;
            border-radius: 10px;
            background-color: #f9f9f9;
            margin-bottom: 20px;
            width: 80%;
        }

        input[type="submit"] {
            background-color: #4a90e2;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #357ab7;
        }

        img {
            margin-top: 20px;
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .image-section {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎨 Image Color Quantizer</h2>
        <form action="/" method="post" enctype="multipart/form-data">
            <input type="file" name="image" required><br><br>
            <input type="submit" value="Quantize Image">
        </form>

        {% if original %}
        <div class="image-section">
            <h3>Original Image</h3>
            <img src="{{ url_for('static', filename=original) }}" alt="Original Image">
        </div>

        <div class="image-section">
            <h3>Quantized Image</h3>
            <img src="{{ url_for('static', filename=quantized) }}" alt="Quantized Image">
        </div>
        {% endif %}
    </div>
</body>
</html>
